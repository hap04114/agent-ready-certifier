# Render blueprint for Agent-Ready Certifier (sandbox only).
# Secrets use `sync: false`: Render asks for them in the dashboard; they are never in this file.
databases:
  - name: certifier-db
    plan: free
    databaseName: certifier
    user: certifier

services:
  # Certifier API: boot guard, /health, and the PayPal webhook listener (public HTTPS).
  - type: web
    name: certifier-api
    runtime: node
    plan: free
    # --prod=false: NODE_ENV=production would otherwise skip devDependencies, including tsx,
    # which the start command needs.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    # Start with node directly: pnpm (enabled via corepack at build time) may not exist at runtime.
    startCommand: node node_modules/tsx/dist/cli.mjs apps/api/src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: certifier-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: WEBHOOK_PUBLIC_URL
        sync: false
      - key: DEMO_STORE_BUGGY_CERTIFIER_WEBHOOK_ID
        sync: false
      - key: APIMATIC_CLIENT_ID
        sync: false
      - key: APIMATIC_CLIENT_SECRET
        sync: false
      # Run API, ownership verifier and the AI buyer agent (Milestone 4)
      - key: OWNERSHIP_TOKEN_SECRET
        sync: false
      - key: CERTIFIER_ADMIN_TOKEN
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_FALLBACK_MODELS
        value: openai/gpt-oss-20b,qwen/qwen3.8-27b
      - key: CERT_SIGNING_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false

  # Demo target: the correct, current, secure store. It is a separate merchant system with
  # its own schema in the same database.
  - type: web
    name: demo-store-good
    runtime: node
    plan: free
    # --prod=false: NODE_ENV=production would otherwise skip devDependencies, including tsx,
    # which the start command needs.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    # Start with node directly: pnpm (enabled via corepack at build time) may not exist at runtime.
    startCommand: node node_modules/tsx/dist/cli.mjs apps/demo-stores/src/good/main.ts
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: certifier-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_STORE_GOOD_URL
        sync: false
      - key: DEMO_STORE_GOOD_WEBHOOK_ID
        sync: false
      - key: DEMO_STORE_GOOD_STATUS_KEY
        sync: false
      # Public ownership token the store serves
      - key: DEMO_STORE_GOOD_OWNERSHIP_TOKEN
        sync: false

  # Demo target with the 8 SEEDED BUGS (docs/seeded-bugs.md). Its own throwaway sandbox app,
  # because one seeded bug exposes that app's client secret on purpose. Sandbox only.
  - type: web
    name: demo-store-buggy
    runtime: node
    plan: free
    # --prod=false: NODE_ENV=production would otherwise skip devDependencies, including tsx.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: node node_modules/tsx/dist/cli.mjs apps/demo-stores/src/buggy/main.ts
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: certifier-db
          property: connectionString
      - key: DEMO_STORE_BUGGY_URL
        sync: false
      - key: DEMO_STORE_BUGGY_PAYPAL_CLIENT_ID
        sync: false
      - key: DEMO_STORE_BUGGY_PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_STORE_BUGGY_WEBHOOK_ID
        sync: false
      - key: DEMO_STORE_BUGGY_STATUS_KEY
        sync: false
      - key: DEMO_STORE_BUGGY_OWNERSHIP_TOKEN
        sync: false
